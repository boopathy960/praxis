<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genome OS · Operations that ship as verified, forkable genomes</title>
<style>
  :root{
    --bg:#070b10; --bg2:#0a0f17; --panel:rgba(18,26,38,.62); --panel-solid:#111927;
    --line:rgba(125,200,255,.10); --line-strong:rgba(125,200,255,.20);
    --ink:#e8f1fb; --ink-dim:#9fb2c8; --ink-faint:#62748c;
    --bio:#37e0b0; --bio-dim:#1f8f72; --helix:#7c5cff; --helix-dim:#4a39a8;
    --gold:#ffc24b; --warn:#ff9f45; --bad:#ff5d6c; --good:#37e0b0; --info:#49b6ff;
    --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Cascadia Code',Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
    --shadow:0 18px 50px -22px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    background-image:
      radial-gradient(1100px 700px at 82% -8%, rgba(124,92,255,.16), transparent 60%),
      radial-gradient(900px 600px at 8% 4%, rgba(55,224,176,.12), transparent 55%),
      linear-gradient(180deg,#070b10,#080d14 40%,#070a0f);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(125,200,255,.14);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── Header ── */
  header{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:22px;
    padding:14px 26px;backdrop-filter:blur(16px);
    background:linear-gradient(180deg,rgba(8,12,18,.92),rgba(8,12,18,.55));
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:236px}
  .brand canvas{width:46px;height:46px;filter:drop-shadow(0 0 12px rgba(124,92,255,.5))}
  .brand .name{font-weight:800;letter-spacing:.4px;font-size:18px;line-height:1}
  .brand .name b{color:var(--bio)}
  .brand .tag{font-size:10.5px;color:var(--ink-faint);letter-spacing:1.6px;text-transform:uppercase;margin-top:4px}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav a{
    padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink-dim);
    border:1px solid transparent;transition:.15s;cursor:pointer;
  }
  nav a:hover{color:var(--ink);background:rgba(125,200,255,.06)}
  nav a.active{color:var(--ink);background:linear-gradient(180deg,rgba(124,92,255,.22),rgba(55,224,176,.10));border-color:var(--line-strong)}
  .spacer{flex:1}
  .kpi-chips{display:flex;gap:10px}
  .chip{display:flex;flex-direction:column;gap:2px;padding:7px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-width:84px}
  .chip .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .chip .l{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.8px}

  /* ── Layout ── */
  main{max-width:1500px;margin:0 auto;padding:26px}
  .grid{display:grid;gap:18px}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;
    box-shadow:var(--shadow);backdrop-filter:blur(8px);
  }
  .panel h2{margin:0 0 4px;font-size:16px;letter-spacing:.2px}
  .panel .sub{color:var(--ink-faint);font-size:12.5px;margin-bottom:16px;line-height:1.5}
  .section-title{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
  .section-title h1{font-size:23px;margin:0;font-weight:800;letter-spacing:.2px}
  .section-title .lead{color:var(--ink-dim);font-size:13.5px;max-width:760px;line-height:1.55}

  /* ── Stat cards ── */
  .stats{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
  .stat{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(20,30,44,.7),rgba(12,18,28,.6));
    border:1px solid var(--line);border-radius:16px;padding:16px 17px}
  .stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,var(--accent,rgba(55,224,176,.25)),transparent 70%);opacity:.6}
  .stat .v{font-size:26px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .stat .l{font-size:11.5px;color:var(--ink-dim);margin-top:3px}
  .stat .d{font-size:11px;color:var(--ink-faint);margin-top:7px;line-height:1.4}

  /* ── Pills & badges ── */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .pill .dot{width:7px;height:7px;border-radius:50%}
  .pill.minted{background:rgba(124,92,255,.16);color:#c3b4ff} .pill.minted .dot{background:var(--helix)}
  .pill.certified{background:rgba(55,224,176,.14);color:#8df0d2} .pill.certified .dot{background:var(--bio)}
  .pill.draft{background:rgba(73,182,255,.14);color:#a9dcff} .pill.draft .dot{background:var(--info)}
  .pill.quarantined{background:rgba(255,93,108,.16);color:#ffb0b8} .pill.quarantined .dot{background:var(--bad)}
  .pill.deprecated{background:rgba(98,116,140,.18);color:#b3c2d4} .pill.deprecated .dot{background:var(--ink-faint)}
  .pill.ok{background:rgba(55,224,176,.14);color:#8df0d2}.pill.ok .dot{background:var(--bio)}
  .pill.no{background:rgba(255,93,108,.16);color:#ffb0b8}.pill.no .dot{background:var(--bad)}
  .tag-chip{display:inline-block;padding:3px 9px;border-radius:8px;background:rgba(125,200,255,.07);border:1px solid var(--line);font-size:11px;color:var(--ink-dim);font-family:var(--mono)}
  .mono{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}

  /* ── Buttons & inputs ── */
  button,.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-strong);background:rgba(125,200,255,.06);
    color:var(--ink);padding:9px 15px;border-radius:11px;font-size:13px;font-weight:650;transition:.15s}
  button:hover,.btn:hover{background:rgba(125,200,255,.12);border-color:var(--bio-dim)}
  .btn-primary{background:linear-gradient(180deg,var(--bio),var(--bio-dim));color:#04231b;border:none;font-weight:750}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-violet{background:linear-gradient(180deg,var(--helix),var(--helix-dim));color:#fff;border:none;font-weight:750}
  .btn-ghost{background:transparent}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}
  .btn-danger{border-color:rgba(255,93,108,.4);color:#ffb0b8}
  .btn-danger:hover{background:rgba(255,93,108,.14)}
  input,textarea,select{font-family:var(--sans);background:rgba(7,11,17,.7);border:1px solid var(--line-strong);
    color:var(--ink);border-radius:11px;padding:10px 13px;font-size:13.5px;width:100%;outline:none;transition:.15s}
  input:focus,textarea:focus,select:focus{border-color:var(--bio-dim);box-shadow:0 0 0 3px rgba(55,224,176,.12)}
  textarea{resize:vertical;min-height:84px;line-height:1.5}
  label.field{display:block;margin-bottom:13px}
  label.field>span{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;font-weight:600}
  label.field .hint{color:var(--ink-faint);font-weight:400;font-family:var(--mono);font-size:11px}

  /* ── Tables ── */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--ink-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid rgba(125,200,255,.05);vertical-align:middle}
  tr:hover td{background:rgba(125,200,255,.03)}

  /* ── Genome cards ── */
  .genome-grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .gcard{cursor:pointer;position:relative;overflow:hidden;transition:.18s;border-radius:16px}
  .gcard:hover{transform:translateY(-3px);border-color:var(--line-strong)}
  .gcard .bar{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent,var(--bio)),transparent)}
  .gcard h3{margin:13px 0 3px;font-size:15.5px}
  .gcard .op{font-family:var(--mono);font-size:11px;color:var(--accent,var(--bio));margin-bottom:11px}
  .gcard .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-dim);margin-top:7px}

  /* ── helix loader / lattice ── */
  svg .edge{stroke:rgba(125,200,255,.22);fill:none}
  svg .edge.refine{stroke:url(#edgeGrad)}
  .node-label{font-size:10.5px;fill:var(--ink-dim);font-family:var(--sans)}
  .gauge-num{font-weight:850;font-variant-numeric:tabular-nums}

  /* ── pipeline ── */
  .pipe{display:flex;flex-direction:column;gap:8px}
  .pipe .step{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:rgba(7,11,17,.45);border:1px solid var(--line)}
  .pipe .step .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
  .pipe .step.pass .ic{background:rgba(55,224,176,.18);color:var(--bio)}
  .pipe .step.fail .ic{background:rgba(255,93,108,.18);color:var(--bad)}
  .pipe .step .stg{font-weight:700;font-size:13px;text-transform:capitalize}
  .pipe .step .dt{font-size:12px;color:var(--ink-dim);margin-top:2px;line-height:1.45}

  /* ── modal ── */
  .modal-wrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(4,7,11,.72);backdrop-filter:blur(6px)}
  .modal-wrap.open{display:flex}
  .modal{width:min(640px,96vw);max-height:90vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line-strong);
    border-radius:20px;padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal .x{position:absolute;top:18px;right:22px;cursor:pointer;color:var(--ink-faint);font-size:22px}

  /* ── toast ── */
  #toast{position:fixed;bottom:24px;right:24px;z-index:120;display:flex;flex-direction:column;gap:10px}
  .toast{padding:13px 17px;border-radius:13px;background:var(--panel-solid);border:1px solid var(--line-strong);
    box-shadow:var(--shadow);font-size:13px;max-width:380px;animation:slideIn .25s ease;display:flex;gap:10px;align-items:flex-start}
  .toast.good{border-left:3px solid var(--bio)} .toast.bad{border-left:3px solid var(--bad)} .toast.info{border-left:3px solid var(--info)}
  @keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{display:grid;place-items:center;padding:80px;color:var(--ink-faint)}
  .loading .ring{width:42px;height:42px;border:3px solid rgba(125,200,255,.15);border-top-color:var(--bio);border-radius:50%;animation:spin .9s linear infinite;margin-bottom:14px}
  .muted{color:var(--ink-faint)}
  .grow{flex:1}
  .flex{display:flex;gap:12px;align-items:center}
  .wrap{flex-wrap:wrap}
  .between{justify-content:space-between}
  .col{display:flex;flex-direction:column;gap:6px}
  code.k{font-family:var(--mono);background:rgba(125,200,255,.08);padding:1px 6px;border-radius:6px;font-size:11.5px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .helix-strip{height:3px;background:repeating-linear-gradient(90deg,var(--bio) 0 10px,transparent 10px 22px);opacity:.4;border-radius:3px;margin:2px 0 0}
</style>
</head>
<body>
<header>
  <div class="brand">
    <canvas id="helix" width="92" height="92" aria-hidden="true"></canvas>
    <div>
      <div class="name">Genome<b>OS</b></div>
      <div class="tag">proof-carrying operations</div>
    </div>
  </div>
  <nav id="nav">
    <a data-view="overview" class="active">Overview</a>
    <a data-view="commons">Commons</a>
    <a data-view="compile">Compile</a>
    <a data-view="signoffs">Sign-offs</a>
    <a data-view="risk">Underwriting</a>
    <a data-view="evolution">Evolution</a>
  </nav>
  <div class="spacer"></div>
  <div class="kpi-chips" id="kpiChips"></div>
</header>

<main id="app">
  <div class="loading"><div class="ring"></div>booting the commons…</div>
</main>

<div class="modal-wrap" id="modalWrap"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
//============================================================ helpers
const API = '';
const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,attrs={},...kids)=>{
  const n=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')n.className=v; else if(k==='html')n.innerHTML=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v); else if(v!=null)n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){ if(kid!=null) n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;
};
const fmt=(n,d=0)=>n==null||isNaN(n)?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d>0?0:0});
const money=n=>'$'+fmt(n,0);
const pct=n=>n==null?'—':(n*100).toFixed(1)+'%';
async function api(path,opts){
  const r=await fetch(API+'/api/v1'+path,{headers:{'Content-Type':'application/json'},...opts});
  let body; try{body=await r.json()}catch{body={}}
  if(!r.ok||body.ok===false) throw new Error(body.error||('HTTP '+r.status));
  return body.data;
}
function toast(msg,kind='info'){
  const t=el('div',{class:'toast '+kind},el('div',{class:'grow'},msg),el('div',{class:'x',style:'cursor:pointer;color:var(--ink-faint)',onclick:e=>e.target.parentElement.remove()},'×'));
  $('#toast').append(t); setTimeout(()=>t.remove(),5200);
}
function statusPill(s){return el('span',{class:'pill '+s},el('span',{class:'dot'}),s)}

//============================================================ DNA helix logo (animated canvas)
(function(){
  const c=$('#helix'),x=c.getContext('2d'),W=92,H=92; let t=0;
  function frame(){
    x.clearRect(0,0,W,H); t+=0.035;
    for(let i=0;i<=28;i++){
      const p=i/28, y=8+p*76, ph=t+p*Math.PI*2.4;
      const x1=46+Math.sin(ph)*22, x2=46-Math.sin(ph)*22, depth=(Math.cos(ph)+1)/2;
      if(i%2===0){ x.strokeStyle=`rgba(125,170,220,${0.12+depth*0.22})`; x.lineWidth=1.4; x.beginPath();x.moveTo(x1,y);x.lineTo(x2,y);x.stroke(); }
      const r1=2+depth*2.2, r2=2+(1-depth)*2.2;
      x.fillStyle=`rgba(55,224,176,${0.5+depth*0.5})`; x.beginPath();x.arc(x1,y,r1,0,7);x.fill();
      x.fillStyle=`rgba(124,92,255,${0.5+(1-depth)*0.5})`; x.beginPath();x.arc(x2,y,r2,0,7);x.fill();
    }
    requestAnimationFrame(frame);
  } frame();
})();

//============================================================ SVG gauges
function radialGauge(value,{max=100,label='',unit='',color='var(--bio)',size=132}={}){
  const r=size/2-12, cx=size/2, cy=size/2, frac=Math.max(0,Math.min(1,value/max));
  const circ=2*Math.PI*r, off=circ*(1-frac);
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox',`0 0 ${size} ${size}`); svg.setAttribute('width',size);svg.setAttribute('height',size);
  const bg=document.createElementNS(ns,'circle');[['cx',cx],['cy',cy],['r',r]].forEach(([k,v])=>bg.setAttribute(k,v));
  bg.setAttribute('fill','none');bg.setAttribute('stroke','rgba(125,200,255,.10)');bg.setAttribute('stroke-width','9');svg.append(bg);
  const fg=document.createElementNS(ns,'circle');[['cx',cx],['cy',cy],['r',r]].forEach(([k,v])=>fg.setAttribute(k,v));
  fg.setAttribute('fill','none');fg.setAttribute('stroke',color);fg.setAttribute('stroke-width','9');fg.setAttribute('stroke-linecap','round');
  fg.setAttribute('stroke-dasharray',circ);fg.setAttribute('stroke-dashoffset',circ);fg.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);
  fg.style.transition='stroke-dashoffset 1s ease'; svg.append(fg); setTimeout(()=>fg.setAttribute('stroke-dashoffset',off),60);
  const tv=document.createElementNS(ns,'text');tv.setAttribute('x',cx);tv.setAttribute('y',cy-2);tv.setAttribute('text-anchor','middle');
  tv.setAttribute('fill','var(--ink)');tv.setAttribute('font-size','25');tv.setAttribute('font-weight','850');tv.setAttribute('class','gauge-num');
  tv.textContent=(typeof value==='number'?(Number.isInteger(value)?value:value.toFixed(0)):value)+unit; svg.append(tv);
  if(label){const tl=document.createElementNS(ns,'text');tl.setAttribute('x',cx);tl.setAttribute('y',cy+16);tl.setAttribute('text-anchor','middle');
    tl.setAttribute('fill','var(--ink-faint)');tl.setAttribute('font-size','10.5');tl.textContent=label;svg.append(tl);}
  return svg;
}
// coverage ring: realised vs target
function coverageRing(coverage,target,{size=150}={}){
  const ns='http://www.w3.org/2000/svg', r=size/2-14, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${size} ${size}`);svg.setAttribute('width',size);svg.setAttribute('height',size);
  const bg=document.createElementNS(ns,'circle');bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',r);bg.setAttribute('fill','none');bg.setAttribute('stroke','rgba(125,200,255,.10)');bg.setAttribute('stroke-width','11');svg.append(bg);
  const ok=coverage>=target;
  const fg=document.createElementNS(ns,'circle');fg.setAttribute('cx',cx);fg.setAttribute('cy',cy);fg.setAttribute('r',r);fg.setAttribute('fill','none');
  fg.setAttribute('stroke',ok?'var(--bio)':'var(--warn)');fg.setAttribute('stroke-width','11');fg.setAttribute('stroke-linecap','round');
  fg.setAttribute('stroke-dasharray',circ);fg.setAttribute('stroke-dashoffset',circ);fg.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);fg.style.transition='stroke-dashoffset 1.1s ease';
  svg.append(fg);setTimeout(()=>fg.setAttribute('stroke-dashoffset',circ*(1-Math.max(0,Math.min(1,coverage)))),60);
  // target tick
  const ang=-Math.PI/2+2*Math.PI*target, tx1=cx+Math.cos(ang)*(r-9), ty1=cy+Math.sin(ang)*(r-9), tx2=cx+Math.cos(ang)*(r+9), ty2=cy+Math.sin(ang)*(r+9);
  const tick=document.createElementNS(ns,'line');tick.setAttribute('x1',tx1);tick.setAttribute('y1',ty1);tick.setAttribute('x2',tx2);tick.setAttribute('y2',ty2);tick.setAttribute('stroke','var(--ink)');tick.setAttribute('stroke-width','2');svg.append(tick);
  const tv=document.createElementNS(ns,'text');tv.setAttribute('x',cx);tv.setAttribute('y',cy-4);tv.setAttribute('text-anchor','middle');tv.setAttribute('fill','var(--ink)');tv.setAttribute('font-size','24');tv.setAttribute('font-weight','850');tv.textContent=(coverage*100).toFixed(0)+'%';svg.append(tv);
  const tl=document.createElementNS(ns,'text');tl.setAttribute('x',cx);tl.setAttribute('y',cy+15);tl.setAttribute('text-anchor','middle');tl.setAttribute('fill','var(--ink-faint)');tl.setAttribute('font-size','10');tl.textContent='cover · tgt '+(target*100).toFixed(0)+'%';svg.append(tl);
  return svg;
}

//============================================================ router
const VIEWS={};
let CURRENT='overview';
function go(view,arg){ CURRENT=view; location.hash=view+(arg?'/'+arg:''); render(); }
window.addEventListener('hashchange',()=>{const[v]=location.hash.slice(1).split('/');if(v&&v!==CURRENT){CURRENT=v;render();}});
$('#nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a){go(a.dataset.view);}});
function setActive(){ $$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===CURRENT)); }
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

async function render(){
  setActive();
  const app=$('#app'); app.innerHTML='<div class="loading"><div class="ring"></div>sequencing…</div>';
  const[,arg]=location.hash.slice(1).split('/');
  try{ await (VIEWS[CURRENT]||VIEWS.overview)(app,arg); }
  catch(err){ app.innerHTML=''; app.append(el('div',{class:'panel'},el('h2',{},'Could not load'),el('p',{class:'sub'},err.message))); }
  refreshChips();
}
async function refreshChips(){
  try{
    const o=await api('/genome/overview');
    $('#kpiChips').innerHTML='';
    const chips=[['Genomes',o.total_genomes],['Minted',o.minted],['Outcome',money(o.total_outcome_value)],['Risk',o.systemic_risk_score.toFixed(0)]];
    chips.forEach(([l,v])=>$('#kpiChips').append(el('div',{class:'chip'},el('div',{class:'v'},String(v)),el('div',{class:'l'},l))));
  }catch{}
}

//============================================================ OVERVIEW
VIEWS.overview=async(app)=>{
  const[o,genomes,runs]=await Promise.all([api('/genome/overview'),api('/genome/genomes'),api('/genome/runs?limit=8')]);
  app.innerHTML='';
  app.append(el('div',{class:'section-title'},el('div',{},
    el('h1',{},'The commons'),

function invariantShort(inv){
  if(inv.invariant==='money_conservation')return inv.outflow+' ≤ '+inv.inflow;
  if(inv.invariant==='idempotency')return 'idempotent';
  if(inv.invariant==='rate_limit')return inv.counter+' ≤ '+inv.max;
  if(inv.invariant==='eligibility')return 'eligible '+inv.var;
  if(inv.invariant==='bounded')return inv.lo+'≤'+inv.var+'≤'+inv.hi;
  if(inv.invariant==='requires')return 'req '+inv.flag;
  if(inv.invariant==='forbids')return '¬'+inv.flag;
  return inv.label||inv.invariant;
}
function timeAgo(ms){const s=(Date.now()-ms)/1000;if(s<60)return Math.floor(s)+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

function latticeSVG(graph){
  const ns='http://www.w3.org/2000/svg';
  const cols={}, ops=[...new Set(graph.nodes.map(n=>n.operation))];
  ops.forEach((op,i)=>cols[op]=i);
  const colW=260, rowH=96, pad=40;
  const byCol={}; graph.nodes.forEach(n=>{(byCol[n.operation]=byCol[n.operation]||[]).push(n);});
  Object.values(byCol).forEach(list=>list.sort((a,b)=>a.generation-b.generation||a.name.localeCompare(b.name)));
  const pos={};
  Object.entries(byCol).forEach(([op,list])=>list.forEach((n,idx)=>{pos[n.id]={x:pad+cols[op]*colW+colW/2,y:pad+30+idx*rowH};}));
  const maxRows=Math.max(1,...Object.values(byCol).map(l=>l.length));
  const W=pad*2+ops.length*colW, H=pad*2+40+maxRows*rowH;
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',Math.max(W,860));svg.setAttribute('height',H);
  const defs=document.createElementNS(ns,'defs');
  defs.innerHTML=`<linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#37e0b0"/></linearGradient>`;
  svg.append(defs);
  // operation headers
  ops.forEach(op=>{const t=document.createElementNS(ns,'text');t.setAttribute('x',pad+cols[op]*colW+colW/2);t.setAttribute('y',26);t.setAttribute('text-anchor','middle');t.setAttribute('fill','var(--ink-faint)');t.setAttribute('font-size','11');t.setAttribute('font-family','var(--mono)');t.textContent=op;svg.append(t);});
  // edges
  graph.edges.forEach(e=>{const a=pos[e.parent],b=pos[e.child];if(!a||!b)return;
    const path=document.createElementNS(ns,'path');const mx=(a.x+b.x)/2;
    path.setAttribute('d',`M ${a.x} ${a.y+22} C ${a.x} ${a.y+60}, ${b.x} ${b.y-60}, ${b.x} ${b.y-22}`);
    path.setAttribute('class','edge refine');path.setAttribute('stroke-width','1.6');svg.append(path);});
  // nodes
  graph.nodes.forEach(n=>{const p=pos[n.id];const hue=(([...n.id].reduce((a,c)=>a+c.charCodeAt(0),0))*37)%360;
    const grp=document.createElementNS(ns,'g');grp.style.cursor='pointer';grp.addEventListener('click',()=>go('genome',n.id));
    const rad=15+Math.min(14,Math.log10(1+n.outcome_value)*4);
    const glow=document.createElementNS(ns,'circle');glow.setAttribute('cx',p.x);glow.setAttribute('cy',p.y);glow.setAttribute('r',rad+6);glow.setAttribute('fill',`hsla(${hue},80%,60%,.10)`);grp.append(glow);
    const c=document.createElementNS(ns,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',rad);
    const col=n.status==='minted'?'#7c5cff':n.status==='certified'?'#37e0b0':n.status==='quarantined'?'#ff5d6c':'#49b6ff';
    c.setAttribute('fill',`hsla(${hue},70%,55%,.18)`);c.setAttribute('stroke',col);c.setAttribute('stroke-width','2');grp.append(c);
    if(n.certificate_valid){const chk=document.createElementNS(ns,'text');chk.setAttribute('x',p.x);chk.setAttribute('y',p.y+4);chk.setAttribute('text-anchor','middle');chk.setAttribute('font-size','13');chk.setAttribute('fill',col);chk.textContent='✓';grp.append(chk);}
    const lab=document.createElementNS(ns,'text');lab.setAttribute('x',p.x);lab.setAttribute('y',p.y+rad+15);lab.setAttribute('text-anchor','middle');lab.setAttribute('class','node-label');lab.textContent=n.name.length>22?n.name.slice(0,20)+'…':n.name;grp.append(lab);
    svg.append(grp);});
  return svg;
}

      if(w==='toggle')body.inputs[name]={kind:'flag',value:v==='true'};
      else if(w==='money')body.inputs[name]={kind:'money',value:Number(v||0)};
      else if(w==='number')body.inputs[name]={kind:'count',value:Math.round(Number(v||0))};
      else if(w==='timestamp')body.inputs[name]={kind:'time',value:Math.round(Number(v||0))};
      else body.inputs[name]={kind:'tag',value:v};
    }
    try{const r=await api('/genome/genomes/'+g.genome_id+'/run',{method:'POST',body:JSON.stringify(body)});
      out.innerHTML=''; out.append(runPipeline(r));
      toast('Run '+r.status.replace('_',' '),r.status==='executed'?'good':r.status==='blocked'?'bad':'info');
    }catch(e){toast(e.message,'bad')}
  }},'Execute through the swarm'));
  wrap.append(out);
  openModal(wrap);
}
function runPipeline(r){
  const box=el('div',{style:'margin-top:18px'});
  box.append(el('div',{class:'flex between',style:'margin-bottom:10px'},el('b',{},'Pipeline'),el('span',{class:'pill '+(r.status==='executed'?'ok':r.status==='blocked'?'no':'draft')},el('span',{class:'dot'}),r.status.replace('_',' '))));
  const pipe=el('div',{class:'pipe'});
  r.steps.forEach(s=>pipe.append(el('div',{class:'step '+(s.passed?'pass':'fail')},el('div',{class:'ic'},s.passed?'✓':'✗'),el('div',{},el('div',{class:'stg'},s.stage),el('div',{class:'dt'},s.detail)))));
  box.append(pipe);

}

VIEWS.risk=async(app)=>{
  const r=await api('/genome/risk');
  app.innerHTML='';
  app.append(el('div',{class:'section-title'},el('div',{},el('h1',{},'Underwriting desk'),
    el('div',{class:'lead'},'The warranty layer is correlated-risk underwriting. Failures correlate through shared lineage, so the right object is a contagion structure over the lineage graph; the governance rule that falls out is a concentration limit.'))));

  const top=el('div',{class:'grid',style:'grid-template-columns:auto 1fr;gap:18px;align-items:center'});
  const gp=el('div',{class:'panel',style:'display:grid;place-items:center'});
  gp.append(radialGauge(r.systemic_risk_score,{max:100,label:'systemic risk',color:r.systemic_risk_score>50?'var(--bad)':r.systemic_risk_score>20?'var(--warn)':'var(--bio)',size:170}));
  top.append(gp);
  const sp=el('div',{class:'grid stats'});
  const c=(v,l,d,a)=>el('div',{class:'stat',style:`--accent:${a}`},el('div',{class:'v'},v),el('div',{class:'l'},l),el('div',{class:'d'},d));
  sp.append(
    c(money(r.portfolio_expected_loss),'portfolio expected loss','Σ pᵢ·exposureᵢ','rgba(73,182,255,.3)'),
    c(money(r.portfolio_tail_loss_99),'99% tail loss','EVT-inflated, correlated','rgba(255,93,108,.3)'),
    c(money(r.total_premium),'total premium','expected loss + risk loading','rgba(255,194,75,.3)'),
    c(pct(r.concentration_cap),'concentration cap','per critical operation','rgba(124,92,255,.3)'),
  );
  top.append(sp);
  app.append(top);

  // concentration
  r.concentration.forEach(c=>{
    const p=el('div',{class:'panel',style:'margin-top:18px'},el('div',{class:'flex between'},el('h2',{},'Concentration · '+c.operation),c.breached?el('span',{class:'pill no'},el('span',{class:'dot'}),'cap breached'):el('span',{class:'pill ok'},el('span',{class:'dot'}),'within limits')),
      el('div',{class:'sub'},fmt(c.total_runs)+' total runs · no single genome may exceed '+pct(c.cap)+' of this operation network-wide.'));
    c.entries.forEach(e=>{
      const bar=el('div',{style:'height:10px;border-radius:6px;background:rgba(125,200,255,.08);overflow:hidden;position:relative'});
      bar.append(el('div',{style:`height:100%;width:${Math.min(100,e.share*100)}%;background:${e.over_cap?'linear-gradient(90deg,var(--bad),#ff8a94)':'linear-gradient(90deg,var(--bio),var(--helix))'};transition:width 1s`}));
      // cap marker
      bar.append(el('div',{style:`position:absolute;top:-2px;bottom:-2px;left:${c.cap*100}%;width:2px;background:var(--ink)`}));
      p.append(el('div',{style:'margin:11px 0'},el('div',{class:'flex between',style:'font-size:12.5px;margin-bottom:5px'},el('span',{style:'cursor:pointer',onclick:()=>go('genome',e.id)},e.name),el('b',{style:e.over_cap?'color:var(--bad)':''},pct(e.share))),bar));
    });
    app.append(p);
  });

  // clusters + premiums
  const cols=el('div',{class:'grid',style:'grid-template-columns:1fr 1fr;gap:18px;margin-top:18px'});
  const cl=el('div',{class:'panel'},el('h2',{},'Correlated clusters'),el('div',{class:'sub'},'Genomes sharing a lineage root fail together — the contagion structure the tail is priced over.'));
  const clt=el('table');clt.append(el('thead',{},el('tr',{},...['Cluster root','Members','ρ','Tail loss'].map(h=>el('th',{},h)))));
  const clb=el('tbody');r.clusters.forEach(x=>clb.append(el('tr',{},el('td',{},el('span',{class:'mono',style:'font-size:11px'},x.root.slice(0,14))),el('td',{},x.members),el('td',{},x.correlation.toFixed(2)),el('td',{},money(x.tail_loss_99)))));
  clt.append(clb);cl.append(clt);cols.append(cl);

  const pr=el('div',{class:'panel'},el('h2',{},'Per-genome premiums'),el('div',{class:'sub'},'The price of the warranty — expected loss plus a risk loading on the tail.'));
  const prt=el('table');prt.append(el('thead',{},el('tr',{},...['Genome','Fail prob','Expected loss','Premium'].map(h=>el('th',{},h)))));
  const prb=el('tbody');r.premiums.forEach(x=>prb.append(el('tr',{},el('td',{style:'cursor:pointer',onclick:()=>go('genome',x.id)},x.name),el('td',{},(x.failure_prob*100).toFixed(2)+'%'),el('td',{},money(x.expected_loss)),el('td',{},money(x.premium)))));
  prt.append(prb);pr.append(prt);cols.append(pr);
  app.append(cols);
};

async function loadEvo(op,out){
  out.innerHTML='<div class="loading"><div class="ring"></div>allocating traffic…</div>';
  try{const r=await api('/genome/operations/'+encodeURIComponent(op)+'/evolve');
    out.innerHTML='';
    out.append(el('div',{class:'flex wrap',style:'gap:10px;margin-bottom:14px'},
      el('div',{class:'stat',style:'--accent:rgba(124,92,255,.3);min-width:150px'},el('div',{class:'v',style:'font-size:18px'},r.promotable?'PROMOTE':'HOLD'),el('div',{class:'l'},'recommendation')),
      el('div',{class:'stat',style:'--accent:rgba(255,159,69,.3);min-width:150px'},el('div',{class:'v',style:'font-size:18px'},r.winners_curse_inflation.toFixed(3)),el('div',{class:'l'},'winner’s-curse inflation')),
    ));
    out.append(el('div',{class:'muted',style:'font-size:13px;margin-bottom:14px;line-height:1.5'},r.recommendation));
    const tb=el('table');tb.append(el('thead',{},el('tr',{},...['Variant','Pulls','Raw mean','Corrected','SE','Status'].map(h=>el('th',{},h)))));
    const body=el('tbody');
    r.arms.forEach(a=>{
      const isWin=a.genome_id===r.corrected_best;
      body.append(el('tr',{},
        el('td',{style:isWin?'color:var(--bio);font-weight:700':''},(isWin?'★ ':'')+a.label.slice(0,16)),
        el('td',{},a.pulls),el('td',{},a.mean.toFixed(3)),el('td',{},a.corrected_mean.toFixed(3)),el('td',{},isFinite(a.standard_error)?a.standard_error.toFixed(3):'—'),
        el('td',{},a.disqualified?el('span',{class:'pill no'},el('span',{class:'dot'}),'disqualified'):el('span',{class:'pill ok'},el('span',{class:'dot'}),'qualified'))));
    });
    tb.append(body);out.append(tb);
  }catch(e){out.innerHTML='';out.append(el('div',{class:'muted',style:'padding:24px;text-align:center'},e.message));}
}
