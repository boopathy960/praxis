[package]
name = "praxis-pi"
version = "0.1.0"
edition = "2021"
description = "Praxis OS on AArch64 / Raspberry Pi — the nucleus on ARM64, no host OS beneath it."

[dependencies]
praxis-nucleus = { path = "../nucleus" }

# A kernel binary has no host test harness; tests live in the nucleus.
[[bin]]
name = "praxis-pi"
path = "src/main.rs"
test = false
bench = false
